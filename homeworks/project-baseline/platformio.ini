; Repository baseline — NOT a course homework. See README.md in this directory.
;
; The N16R8 environment facts — the exact platform pin, the four module overrides,
; the PSRAM build flag, the monitor speed and the three console ports — live in the
; shared fragment named below, so the pin has exactly one home and a new project
; cannot forget them. This file keeps only what is specific to this project: the
; board and the framework, named per environment in the [env:<id>_s3] block below.
; They are NOT in the fragment because its bare [env] block is inherited by every
; environment of every consuming project and an inherited key cannot be unset — a
; `platform = native` environment, which names neither, could not exist there.
;
; The console ports are pinned in the fragment as glob patterns, not as literal
; device nodes: the repository is public and no port is verified on this machine.
;
; The environment name is derived mechanically from the directory id by
; `envNames()` in tools/lib/discover.mjs: hyphens stripped, then the suffix. Do not
; rename it by hand. This header is required — a project carrying only the
; extra-configs key creates no environment at all and the run dies with
; ProjectEnvsNotAvailableError.
[platformio]
extra_configs = ../../shared/pio/base.ini

[env:projectbaseline_s3]
board = esp32-s3-devkitc-1
framework = arduino
