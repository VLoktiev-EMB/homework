; Shared N16R8 environment facts — the single enforcement point for the exact
; platform pin and the four module overrides. Every homework consumes it through
; its own [platformio] section:
;
;   [platformio]
;   extra_configs = ../../shared/pio/base.ini
;
; This is NOT a project file. It is never named platformio.ini and it declares no
; environment of its own: it is a global defaults layer that PlatformIO merges
; into every [env:<name>] section of every consuming project.
;
; Why the overrides exist. The official `esp32-s3-devkitc-1` board definition
; describes the N8 module — 8 MB flash, no PSRAM — so its defaults are wrong for
; this hardware. `board_build.arduino.memory_type` in particular decides which
; prebuilt core library set is linked, so a wrong value is a library-selection
; decision and not a stylistic difference.
;
; Override rule — a project changes a value here ONLY by re-declaring that single
; key inside its own [env:<id>_s3] section. A second [env] block written in the
; project loses silently, with no warning of any kind, which is why the rule is
; stated here rather than left to the diff.
;
; List-option rule — an environment-level `build_flags` line REPLACES this list
; rather than appending to it. A project that adds its own flag must interpolate
; this list first:
;
;   build_flags = ${env.build_flags} -DEXTRA=1
;
; Without the interpolation the PSRAM flag disappears from the build and the
; build still succeeds, taking every psramFound() reading with it.
;
; A fragment that cannot be found is not an error. PlatformIO exits 0 and the
; environment comes out with an empty body, so any check reads the resolved
; CONTENT of the environment — never the exit status.
;
; The resolved versions these keys resolve to are recorded beside this file, in
; shared/pio/VERSIONS.md.

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 module overrides (the stock board definition describes the N8) ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM

; --- Console: the UART bridge, not native USB CDC ---
; Ports are glob patterns, never literal device nodes: the repository is public
; and a literal node would be either a private machine detail or a build-breaker
; elsewhere. A pattern that matches nothing fails loudly, which is why the glob
; is safe.
;
; Settled by measurement (plan 02-03), not by documentation. The bridge on this
; board enumerates under `usbmodem`, not `usbserial` — note the prefix carries no
; hyphen. The previously committed `/dev/cu.usbserial-*` matched no node before or
; after the board was attached, and `pio run -t upload` stopped with "Please
; specify `upload_port`" rather than flashing an unidentified device. The pattern
; below is the form that run measured the board present under.
;
; Residual, recorded rather than papered over: the module's other USB socket — its
; built-in USB-Serial/JTAG — enumerates under the same `usbmodem` prefix, so this
; pattern cannot separate the two when both sockets are cabled at once. Both reach
; the same chip, so a flash is safe either way; a monitor opened on the wrong
; socket prints nothing, because the vehicle writes to UART0, which only the
; bridge exposes.
monitor_speed = 115200
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
test_port = /dev/cu.usbmodem*
